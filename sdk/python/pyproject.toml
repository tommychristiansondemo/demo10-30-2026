[project]
name = "gridsight"
version = "1.0.0"
description = "Python client for the GridSight AI API"
requires-python = ">=3.9"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
