name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w web
      # Synth both environments with a placeholder zone ID (no AWS lookups needed).
      - run: cd infra && npx cdk synth -c env=dev -c hostedZoneId=Z0000000EXAMPLE --quiet
      - run: cd infra && npx cdk synth -c env=prod -c hostedZoneId=Z0000000EXAMPLE --quiet
